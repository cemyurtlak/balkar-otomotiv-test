<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balkar Otomotiv</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="varliklar/img/favicon-32.png" sizes="32x32">
<link rel="alternate" hreflang="tr" href="https://www.balkarotomotiv.com/tr/">
<link rel="alternate" hreflang="en" href="https://www.balkarotomotiv.com/en/">
<link rel="alternate" hreflang="ru" href="https://www.balkarotomotiv.com/ru/">
<link rel="alternate" hreflang="de" href="https://www.balkarotomotiv.com/de/">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#14120f;color:#f3eee4;font:16px/1.5 system-ui,sans-serif}
  main{text-align:center;padding:24px}
  img{width:140px;height:140px}
  nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
  a{color:#14120f;background:#d8b45c;padding:10px 18px;border-radius:999px;text-decoration:none;font-weight:600}
</style>
<script>
  (function(){
    var izinli = ["tr", "en", "ru", "de"];
    var secili = null;
    try { secili = localStorage.getItem("balkar_dil"); } catch (e) {}
    if (!secili) {
      var tarayici = (navigator.languages || [navigator.language || "tr"]);
      for (var i = 0; i < tarayici.length && !secili; i++) {
        var k = String(tarayici[i]).slice(0, 2).toLowerCase();
        if (izinli.indexOf(k) > -1) secili = k;
      }
    }
    if (izinli.indexOf(secili) < 0) secili = "tr";
    location.replace(secili + "/index.html" + location.hash);
  })();
</script>
</head>
<body>
<main>
  <img src="varliklar/img/logo-512.png" alt="Balkar Otomotiv">
  <nav>
    <a href="tr/index.html" hreflang="tr">Türkçe</a>
    <a href="en/index.html" hreflang="en">English</a>
    <a href="ru/index.html" hreflang="ru">Русский</a>
    <a href="de/index.html" hreflang="de">Deutsch</a>
  </nav>
</main>
</body>
</html>
